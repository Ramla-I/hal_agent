# Egress allowlist proxy for the baseline container.
# Permits HTTPS CONNECT tunnels to api.anthropic.com only; denies everything
# else. Hostname-based (CDN-IP-proof). If a first run shows Claude needs another
# Anthropic endpoint, add it as another dstdomain line below.
acl anthropic dstdomain api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT anthropic SSL_ports
http_access deny all

http_port 3128
# default file log at /var/log/squid/access.log (writable by the 'proxy' user);
# to watch blocks live on a first run:  docker exec <proxy> tail -f /var/log/squid/access.log
