# targets/stm.toml — STM device -> PAC crate -> higher-level consumers.
#
# One [[manual]] block per STM reference manual with assets in the repo
# (devices/stm/<rm>/). Constraints are extracted PER MANUAL; each device is
# that manual's projection onto one chip. `constraints_corpus = true` means
# extraction runs for this manual exist in the 30-manual corpus today.
#
# PURE CONFIGURATION: no experiment results in this file (they live in
# committed per-run reports). Fields verified against the crates.io index on
# 2026-07-16: pac.version exists, feature names are the crate's own, and a
# consumer `version` is only pinned where a released HAL version actually
# depends on this PAC version ("pairing"). status vocabulary:
#   measured  - adoption experiment has been run at least once
#   ready     - all pieces exist, experiment not yet run
#   no-pairing- no released HAL version depends on PAC 0.16 (use git rev later)
#   no-pac    - family has no published PAC crate at all

# ---------------------------------------------------------------------------
# Toolchain lineage (Ramla 2026-07-16: track which svd2rust generates the PAC
# each HAL crate consumes):
#   - the 0.16.0 PAC release wave is generated with svd2rust 0.36.1
#     (verified from the crates' own lib.rs stamp) — our injector targets
#     this template generation.
#   - POLICY: prefer a HAL crate's DEVELOPMENT branch against the newest PAC
#     over back-porting the injector to older PAC templates (newer HAL has
#     improvements). `dev_tracks_pac` below records what each HAL dev branch
#     requires (checked 2026-07-16).
#   - POLICY: a PAC self-generated from a raw ST SVD is equivalent to a
#     stm32-rs PAC with no patch files — for `no-pac` families, generate
#     with the same svd2rust version from the SVDs in devices/stm/<rm>/svd/.
[toolchain]
pac_release = "0.16.0"
svd2rust = "0.36.1"

[[manual]]
id = "rm0008"
constraints_corpus = true
pac = { crate = "stm32f1", version = "0.16.0" }
devices = [
  { name = "stm32f101", feature = "stm32f101" },
  { name = "stm32f102", feature = "stm32f102" },
  { name = "stm32f103", feature = "stm32f103" },
  { name = "stm32f107", feature = "stm32f107" },
]
[[manual.consumer]]
name = "stm32f1xx-hal"
kind = "hal"
dev_tracks_pac = "0.16.0"  # fits the 0.16 PAC — a pinned git rev is runnable
source = { registry = "crates.io", version = "=0.11.0" }  # depends on stm32f1 ^0.16.0
patch_method = "patch.crates-io"
status = "ready"

